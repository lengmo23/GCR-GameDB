name: Validate GameDB

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build deterministic index
        run: npm run build
      - name: Verify generated index and checksums are committed
        run: >-
          git diff --exit-code --
          generated/gamedb-v1.json generated/gamedb-v1.json.sha256
          candidates/gamepp-type1.json candidates/gamepp-type1.json.sha256
